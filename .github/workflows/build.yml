name: Build VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Descargar WebView2
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2849.39 -OutputDirectory webview2
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2"
      - name: Build
        run: cmake --build build --config Release --target CM3CHPro_VST3 --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: CM3CH-PRO-VST3-Windows
          path: build/CM3CHPro_artefacts/Release/VST3/
